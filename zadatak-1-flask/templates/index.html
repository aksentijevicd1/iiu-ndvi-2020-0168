<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanje vegetacije | Flask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> <!-- url_for pravi ispravnu adresu css fajla-->
</head>
<body>
    <div class="container">
        <header>
            <h1>Stanje vegetacije</h1>

            <div class="filter-panel">
                <label for="filter-parcela">Prikaži parcelu</label>
                <select id="filter-parcela">
                    <option value="">Sve parcele</option>
                </select>
                <button type="button" id="satelit-btn">Preuzmi sa satelita</button>
            </div>
            <p id="satelit-status" aria-live="polite"></p>

            <form id="merenje-form">
                <select id="input-parcela" required></select>
                <input type="date" id="input-datum" required>
                <input type="number" id="input-ndvi" step="0.01" min="-1" max="1" placeholder="NDVI" required>
                <button type="submit">Dodaj</button>
            </form>
        </header>
        <main>
            <section id="satelit-rezultat" hidden>
                <p id="satelit-detalji"></p>
                <img id="satelit-mapa" alt="NDVI, NDWI i klasifikacija vegetacije">
            </section>
            <ul id="merenja-lista">
            </ul>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
